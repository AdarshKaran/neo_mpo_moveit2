groups:
  arm_group: ur_manipulator
  hand_group: gripper
  eef: endeffector

frames:
  hand_frame: neo_gripper_mount_link
  world: base_link
  table: base_link            # same for a fixed cell; mobile base would differ

group_states:                        # named SRDF poses
  ready: up
  intermediate: intermediate_pose

scene:
  table:
    size: [0.8, 2.0, 0.7] # must match the table in gazebo when simulating
    pose: [0.8, 0.0, 0.0, 1, 0, 0, 0]  # xyz + qw qx qy qz
  shelf_bottom:
    size: [0.6, 0.3, 0.2]
    pose: [0.8, 0.5, 0.8, 1, 0, 0, 0]

motions:
  approach: { min: 0.05, max: 0.10 }
  lift:     { min: 0.10, max: 0.30 }
  retreat:  { min: 0.12, max: 0.25 }

scaling:
  cartesian: { v: 0.10, a: 0.10 }
  joint:     { v: 0.20, a: 0.20 }
  return_home: { v: 0.60, a: 0.60 }

grasp_offset:
  vertical:
    rpy: [0.0, 1.5708, 0.0]   # rad
    xyz: [0.0, 0.0, -0.15]
  horizontal:
    rpy: [0.0, -1.5708, 0.0]
    xyz: [0.0, 0.0,  0.15]

ik:
  grasp_angle_delta: 0.261799   # = π/12
  max_solutions_grasp: 8
  max_solutions_place: 2
  min_solution_distance: 1.0

collision:
  allow_hand_object: true
  allow_object_support: ["simple_table"]
  forbid_after_lift:  ["simple_table", "bin_front_wall", "bin_back_wall",
                       "bin_left_wall", "bin_right_wall"]

planners:
  sampling: pipeline
  cartesian: cartesian
  interpolation: joint

limits:
  connect_timeout: 5.0
  planning_attempts: 5
