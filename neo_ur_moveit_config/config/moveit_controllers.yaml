# MoveIt uses this configuration for controller management
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false # May lead to unexpectedly aborted goals with scaled JTC

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller
    - joint_trajectory_controller
    - dummy_gripper_controller

  scaled_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: True
    joints:
      - $(var prefix)shoulder_pan_joint
      - $(var prefix)shoulder_lift_joint
      - $(var prefix)elbow_joint
      - $(var prefix)wrist_1_joint
      - $(var prefix)wrist_2_joint
      - $(var prefix)wrist_3_joint

  joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: False
    joints:
      - $(var prefix)shoulder_pan_joint
      - $(var prefix)shoulder_lift_joint
      - $(var prefix)elbow_joint
      - $(var prefix)wrist_1_joint
      - $(var prefix)wrist_2_joint
      - $(var prefix)wrist_3_joint

  dummy_gripper_controller:
    action_ns: gripper_cmd
    type: ParallelGripperCommand
    allow_stalling: true # optional if you want to pick grasp objects of unknown size and want the request to succeed when the gripper stalls while grasping the object
    default: true
    joints:
      - robotiq_85_left_knuckle_joint
    command_joint: robotiq_85_left_knuckle_joint